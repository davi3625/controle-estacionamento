<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cadastro de reserva de vaga no estacionamento.">
    <title>ParkControl | Nova reserva</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/model.js" defer></script>
    <script src="./js/controller.js" defer></script>
    <script src="./js/app.js" defer></script>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="./index.html" aria-label="ParkControl - página inicial">ParkControl</a>
        <nav aria-label="Navegação principal">
            <a href="./index.html">Reservas</a>
            <a href="./disponiveis.html">Vagas</a>
            <a class="nav-button active-button" href="./cadastro.html" aria-current="page">+ Nova reserva</a>
        </nav>
    </header>

    <main class="container narrow">
        <section class="page-heading">
            <div>
                <p class="eyebrow">ESTACIONAMENTO</p>
                <h1>Cadastrar reserva</h1>
                <p class="muted">Preencha os dados do proprietário e do veículo.</p>
            </div>
        </section>

        <section class="panel">
            <form id="formCadastro">
                <div class="form-grid">
                    <div class="field">
                        <label for="placa">Placa do veículo *</label>
                        <input type="text" id="placa" name="placa" placeholder="ABC1234 ou ABC1D23"
                               maxlength="7" minlength="7" autocomplete="off"
                               pattern="[A-Za-z]{3}[0-9][A-Za-z0-9][0-9]{2}"
                               title="Informe uma placa no padrão ABC1234 ou ABC1D23." required>
                        <small class="field-hint">Padrão antigo ou Mercosul, sem espaços ou hífen.</small>
                    </div>

                    <div class="field">
                        <label for="proprietario">Nome do proprietário *</label>
                        <input type="text" id="proprietario" name="proprietario"
                               placeholder="Nome completo" maxlength="100" autocomplete="name" required>
                    </div>

                    <div class="field">
                        <label for="apartamento">Número do apartamento *</label>
                        <input type="text" id="apartamento" name="apartamento"
                               placeholder="Ex.: 204" maxlength="10" required>
                    </div>

                    <div class="field">
                        <label for="bloco">Bloco do apartamento *</label>
                        <input type="text" id="bloco" name="bloco"
                               placeholder="Ex.: A" maxlength="30" required>
                    </div>

                    <div class="field">
                        <label for="modelo">Modelo do veículo *</label>
                        <input type="text" id="modelo" name="modelo"
                               placeholder="Ex.: Honda Civic" maxlength="60" required>
                    </div>

                    <div class="field">
                        <label for="cor">Cor do veículo *</label>
                        <input type="text" id="cor" name="cor"
                               placeholder="Ex.: Prata" maxlength="30" required>
                    </div>

                    <div class="field full-width">
                        <label for="vaga">Número da vaga *</label>
                        <select id="vaga" name="vaga" required>
                            <option value="">Carregando vagas disponíveis...</option>
                        </select>
                        <small id="avisoVagas" class="field-hint" aria-live="polite"></small>
                    </div>
                </div>

                <p class="form-help">* Todos os campos são obrigatórios.</p>
                <div class="form-actions">
                    <a class="button secondary" href="./index.html">Cancelar</a>
                    <button class="button primary" id="botaoSalvar" type="submit">Salvar reserva</button>
                </div>
            </form>
        </section>
        <p class="footer-note">Os dados deste protótipo ficam salvos neste navegador.</p>
    </main>
</body>
</html>
